<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <main>
      <div>
        <div class="index-container">
          <div
            id="column-index-container"
            class="player-column-index-container"
          ></div>
          <div>
            <div
              id="row-index-container"
              class="player-row-index-container"
            ></div>
            <div id="player-container" class="container"></div>
          </div>
        </div>
        <div id="player-action" class="action-option">
          <button id="player-action-randomize">Randomize</button>
        </div>
      </div>

      <div>
        <div class="index-container">
          <div
            id="column-index-container"
            class="computer-column-index-container"
          ></div>
          <div>
            <div
              id="row-index-container"
              class="computer-row-index-container"
            ></div>
            <div id="computer-container" class="container"></div>
          </div>
        </div>
        <div id="computer-action" class="action-option">
          <button id="computer-action-randomize">Randomize</button>
        </div>
      </div>
    </main>
    <div id="game-action">
      <button>Start Game</button>
    </div>
  </body>
</html>
